name: Automate Onboarding

on:
  issues:
    types: [opened]

jobs:
  invite:
    runs-on: ubuntu-latest
    # Run only if the newly opened issue has the trigger label
    if: contains(github.event.issue.labels.*.name, 'invite me to the community')

    steps:
      - name: Onboard Member
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.ORG_ADMIN_TOKEN }}
          script: |
            const org = 'Odisha-Students-Code-Community';
            const username = context.payload.issue.user.login;
            const issueNumber = context.issue.number;

            try {
              // 1. Send membership invitation
              console.log(`Inviting ${username} to ${org}...`);
              await github.rest.orgs.setMembershipForUser({
                org: org,
                username: username,
                role: 'member'
              });

              // 2. Add success label and comment
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['invited']
              });

              const commentBody = `### 🎉 Welcome to Odisha Students Code Community (OSCC), @${username}! ❤️\n\n` +
                `An invitation has been sent to your GitHub account to join **${org}**. \n\n` +
                `👉 **[Click here to accept the invitation](https://github.com/orgs/${org}/invitation)** \n\n` +
                `Once you join, please remember to **change your organization membership visibility to Public** so it shows up on your profile! \n` +
                `You can manage this under the [People list](https://github.com/orgs/${org}/people).\n\n` +
                `Explore our official website & projects: https://odisha-students-code-community.github.io/`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: commentBody
              });

            } catch (error) {
              console.error(error);
              const isAlreadyMember = error.message.includes('already a member') || error.status === 422;

              if (isAlreadyMember) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ['invited']
                });

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `ℹ️ @${username}, you are already a member of ${org} or have a pending invitation!\n\nCheck your status here: https://github.com/orgs/${org}`
                });
              } else {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ['invite-failed']
                });

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `⚠️ **Onboarding Automation Failed**\n\nCould not invite @${username}. Error details: \`\`\`${error.message}\`\`\`\n\n*Note: Administrator attention required.*`
                });
              }
            } finally {
              // Always close the issue to keep the tracker clean
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed'
              });
            }

      - name: Notify Discord Channel
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -H "Content-Type: application/json" \
                 -d "{\"content\": \"🎉 **New Member Joined!** Please welcome **${{ github.event.issue.user.login }}** to Odisha Students Code Community (OSCC)! ❤️\"}" \
                 "$DISCORD_WEBHOOK_URL"
          else
            echo "Discord Webhook URL is not configured. Skipping notification."
          fi
